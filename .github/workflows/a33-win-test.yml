name: A33 Studio Windows Test Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - uses: pnpm/action-setup@v6

      - run: pnpm install

      - name: Build (x64 installer only)
        run: pnpm build:win:x64 --publish never --config.win.target=nsis
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - uses: actions/upload-artifact@v7
        with:
          name: a33-studio-win-test
          path: dist/*-setup.exe
          retention-days: 3
          # Installer is already compressed
          compression-level: 0
          if-no-files-found: error
